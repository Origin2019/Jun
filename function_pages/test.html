            panel.classList.remove('hidden');
        }

            $('progressFill').style.width = `${((currentIndex + 1) / QUESTIONS.length) * 100}%`;

            $('prevBtn').classList.toggle('hidden', currentIndex === 0);

            const list = $('optionList');
            list.innerHTML = '';

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'test-option';
                btn.innerHTML = `<span class="test-option-label">${opt.label}</span><span class="test-option-text">${opt.text}</span>`;
                if (answers[currentIndex] === i) {
                    btn.classList.add('selected');
                }
                btn.addEventListener('click', () => {
                    answers[currentIndex] = i;
                    list.querySelectorAll('.test-option').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
                list.appendChild(btn);
            });
        }

        function computeResult() {
            // 加权汇总出用户画像向量
            const user = new Array(8).fill(0);
            QUESTIONS.forEach((q, qi) => {
                const opt = q.options[answers[qi]];
                for (let d = 0; d < 8; d++) {
                    user[d] += q.weight * opt.v[d];
                }
            });

            // 先去掉自身体量，用皮尔逊相关比较"形状"，避免居中节目(如The Fire Within)天然吸分
            const um = user.reduce((a, b) => a + b, 0) / 8;
            const uc = user.map(v => v - um);

            const scored = PROGRAMS.map(p => {
                const pm = p.params.reduce((a, b) => a + b, 0) / 8;
                let dot = 0, normA = 0, normB = 0;
                for (let d = 0; d < 8; d++) {
                    dot += uc[d] * (p.params[d] - pm);
                    normA += uc[d] * uc[d];
                    normB += (p.params[d] - pm) * (p.params[d] - pm);
                }
                return { program: p, score: dot / (Math.sqrt(normA) * Math.sqrt(normB) || 1) };
            });

            // softmax 温度采样：让各套节目都有被开出的机会，而不是锁定单一节目
            const maxScore = Math.max(...scored.map(it => it.score));
            const TEMP = 0.5;
            const exps = scored.map(it => Math.exp((it.score - maxScore) / TEMP));
            const total = exps.reduce((a, b) => a + b, 0);
            let rnd = Math.random() * total;
            const picked = [];
            scored.forEach((it, i) => {
                rnd -= exps[i];
                if (rnd <= 0 && picked.length === 0) {
                    picked.push(it);
                }
            });
            if (picked.length === 0) {
                picked.push(scored[scored.length - 1]);
            }

            // 其余节目按分数排序作为候选推荐
            scored.sort((a, b) => b.score - a.score);
            return picked.concat(scored.filter(it => it !== picked[0]));
        }

        function showResult() {
            const scored = computeResult();
            const top = scored[0].program;
            $('resultName').textContent = top.name;
            $('resultMeta').textContent = top.meta;
            $('resultTags').textContent = top.tags.join(' · ');
            $('resultLink').href = top.url;

            const wrap = $('runnerups');
            wrap.innerHTML = '';
            scored.slice(1, 4).forEach(item => {
                const box = document.createElement('div');
                box.className = 'test-runnerup';
                const tags = item.program.tags.join(' · ');
                box.innerHTML = `
                    <strong>${item.program.name}</strong>
                    <span>${item.program.meta}</span>
                    <em>${tags}</em>
                    <a href="${item.program.url}" target="_blank" rel="noopener">观看</a>
                `;
                wrap.appendChild(box);
            });
        }

        $('startBtn').addEventListener('click', () => {
            showPanel(quizPanel);
            renderQuestion();
        });

        $('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        $('nextBtn').addEventListener('click', () => {
            if (answers[currentIndex] === undefined) {
                alert('请先选择一项再继续哦');
                return;
            }
            if (currentIndex === QUESTIONS.length - 1) {
                showResult();
                showPanel(resultPanel);
            } else {
                currentIndex++;
                renderQuestion();
            }
        });

        $('restartBtn').addEventListener('click', () => {
            answers.length = 0;
            currentIndex = 0;
            showPanel(startPanel);
        });
    </script>
</body>
</html>

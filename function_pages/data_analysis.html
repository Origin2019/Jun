<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据统计</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body style="background-color: #f8f9fa; margin: 0; padding: 0; min-height: 100vh;">

    <div class="stats-page">
        <h1 class="stats-title">数据统计</h1>

        <div class="cards-container">
            <div class="stat-card">
                <h3>世界排名</h3>
                <p>14</p>
            </div>
            <div class="stat-card">
                <h3>积分</h3>
                <p>3052</p>
            </div>
        </div>

        <!--  新增的搜索框部分  -->
        <div class="search-container" style="text-align: center; margin-bottom: 30px;">
            <input type="text" id="action-search-input" placeholder="输入动作名称（如 3a, 4T+3T）" style="padding: 12px 20px; width: 280px; border: 2px solid #d1e8ff; border-radius: 25px; font-size: 16px; outline: none; transition: all 0.3s ease;">
            <button id="action-search-btn" class="cool-btn" style="margin-left: 10px; padding: 12px 25px;">查找</button>
            <div id="search-message" style="color: #e74c3c; margin-top: 15px; display: none; font-size: 1.1rem; font-weight: bold;">暂无匹配的动作结果</div>
        </div>

        <!-- 新增的左右布局容器 -->
        <div class="stats-layout">
            <!-- 左侧固定目录 -->
            <aside class="stats-toc">
                <div class="toc-title">目录</div>
                <ul class="toc-list">
                    <li>
                        <a href="#jumps">跳跃</a>
                        <ul class="toc-sublist">
                            <li><a href="#jumps-solo">单跳</a></li>
                            <li><a href="#jumps-combo">连跳</a></li>
                        </ul>
                    </li>
                    <li><a href="#spins">旋转</a></li>
                    <li><a href="#steps">步法</a></li>
                </ul>
            </aside>

            <!-- 右侧数据内容 -->
            <div id="analysis-content" class="stats-content">
                <div class="loading">数据加载中，请稍候...</div>
            </div>
        </div>
    </div>

    <script>
        // 并发请求两个 JSON 数据文件
        Promise.all([
            fetch('../data/competitions.json?t=' + new Date().getTime()).then(res => res.json()),
            fetch('../data/detailed_scores.json?t=' + new Date().getTime()).then(res => res.json())
        ]).then(([competitions, detailedScores]) => {

            // 1. 筛选比赛并建立映射关系
            const validProtocols = {};
            competitions.forEach(seasonData => {
                seasonData.events.forEach(event => {
                    // 严格过滤：排除名称包含“韩国”或“选拔”的比赛
                    if (event.name.includes('韩国') || event.name.includes('选拔')) return;

                    // 映射短节目和自由滑的 Protocol ID
                    if (event.segments && event.segments.SP && event.segments.SP.protocol_id) {
                        validProtocols[event.segments.SP.protocol_id] = {
                            season: seasonData.season,
                            event_name: event.name + ' - SP'
                        };
                    }
                    if (event.segments && event.segments.FS && event.segments.FS.protocol_id) {
                        validProtocols[event.segments.FS.protocol_id] = {
                            season: seasonData.season,
                            event_name: event.name + ' - FS'
                        };
                    }
                });
            });

            // 2. 提取并根据规则分组动作
            const grouped = {
                jumps_solo: {},
                jumps_combo: {},
                spins: {},
                steps: {}
            };

            Object.keys(detailedScores).forEach(pid => {
                if (!validProtocols[pid]) return;
                const comp = validProtocols[pid];
                const elements = detailedScores[pid].elements || [];

                elements.forEach(el => {
                    let cat = '';
                    let originalName = el.name.trim(); // 【修改点1】：将 const 改为 let，以便后续追加 " F"
                    let cleanName = originalName;

                    // 核心分类逻辑
                    if (cleanName.includes('Sp')) {
                        cat = 'spins';
                        cleanName = cleanName.replace(/V/g, ''); // 【重点】去除旋转动作中的 V
                    } else if (cleanName.includes('StSq') || cleanName.includes('ChSq')) {
                        cat = 'steps';
                    } else {
                        // 【重点】这里是跳跃，利用正则剥离掉 ! < << q e * 符号
                        cleanName = cleanName.replace(/[!<qe*]/g, '');
                        // 移除 +COMBO 和 +REP
                        cleanName = cleanName.replace(/\+COMBO|\+REP/g, '');
                        // 【新增】：将三连跳中间的 1Lo 统一替换为 1Eu 进行合并分组
                        cleanName = cleanName.replace('+1Lo+', '+1Eu+');

                        if (cleanName.includes('+') || cleanName.includes('SEQ')) {
                            cat = 'jumps_combo';
                        } else {
                            cat = 'jumps_solo';
                        }

                        // 【修改点2】：新增摔倒跳跃判断
                        const infoStr = el.info || '';
                        const judgesArr = el.judges || [];

                        // 从比赛名称中提取第一个四位数字作为年份 (例如从 "2025-26 赛季..." 提取出 2025)
                        const yearMatch = comp.event_name.match(/\d{4}/);
                        const eventYear = yearMatch ? parseInt(yearMatch[0]) : 2099;

                        // 判断条件
                        const hasFInfo = infoStr.includes('F');
                        const isAllMinus5 = judgesArr.length > 0 && judgesArr.every(j => j === '-5');
                        const isAllMinus3 = judgesArr.length > 0 && judgesArr.every(j => j === '-3') && eventYear < 2020;

                        if (hasFInfo || isAllMinus5 || isAllMinus3) {
                            originalName += ' <span style="color: #e74c3c; font-weight: bold; margin-left: 4px;">F</span>';
                        }
                    }

                    const bvVal = parseFloat(el.base_value) || 0;
                    const goeVal = parseFloat(el.goe) || 0;
                    const scoreVal = parseFloat(el.panel_score) || 0;

                    // 【修改】：去除“赛季”二字，并将“2022-23”这种简写补全为“2022-2023”格式
                    let cleanSeason = comp.season.replace(/赛季/g, '').trim();
                    cleanSeason = cleanSeason.replace(/(\d{4})-(\d{2})$/, "$1-20$2");
                    const record = {
                        event: comp.event_name,
                        season: cleanSeason,
                        original_name: originalName, // 存入原名用于在表格中展示
                        has_x: el.has_x ? 'x' : '',
                        goe: goeVal,
                        bv: bvVal,
                        score: scoreVal
                    };

                    // 使用去除符号后纯净的名字进行分组
                    if (!grouped[cat][cleanName]) grouped[cat][cleanName] = [];
                    grouped[cat][cleanName].push(record);
                });
            });

            // 3. 排序核心函数
            const prepareGroup = (groupObj) => {
                return Object.keys(groupObj).map(name => {
                    // ① 同名动作内：按得分高低降序排序
                    const execs = groupObj[name].sort((a, b) => b.score - a.score);
                    // ② 取该动作的历史最高基础分，用于组与组之间的排序
                    const maxBv = Math.max(...execs.map(e => e.bv));
                    const maxScore = Math.max(...execs.map(e => e.score));
                    return { name, execs, maxBv, maxScore };
                }).sort((a, b) => b.maxBv - a.maxBv); // 按基础分值大小降序排列整个列表
            };

            const jumpsSolo = prepareGroup(grouped.jumps_solo);
            const jumpsCombo = prepareGroup(grouped.jumps_combo);
            const spins = prepareGroup(grouped.spins);
            const steps = prepareGroup(grouped.steps);

            // 4. HTML 渲染组件
            const renderTable = (group, type) => {
                if (group.length === 0) return '<p style="color:#7f8c8d; padding:10px;">暂无满足条件的数据</p>';
                return group.map(item => `
                    <details class="element-details">
                        <summary class="element-summary">
                            <div>
                                <span class="summary-name">${item.name}</span>
                                <span class="summary-count">(${item.execs.length}次)</span>
                            </div>
                            <span class="summary-max">最高分: ${item.maxScore.toFixed(2)}</span>
                        </summary>
                        <div class="table-wrapper">
                            <table class="element-table">
                                <thead>
                                    <tr>
                                        <th> </th>
                                        <th style="text-align:left;">比赛</th>
                                        <th>赛季</th>
                                        ${type === 'jump' ? '<th>后半加分</th>' : ''}
                                        <th>Basic Value</th>
                                        <th>GOE</th>
                                        <th>总分</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${item.execs.map(ex => {
                                        // 智能设置 GOE 的颜色
                                        const goeColor = ex.goe > 0 ? '#27ae60' : (ex.goe < 0 ? '#c0392b' : '#7f8c8d');
                                        const goeStr = (ex.goe > 0 ? '+' : '') + ex.goe.toFixed(2);

                                        return `
                                        <tr>
                                            <td>${ex.original_name}</td>
                                            <td style="text-align:left;">${ex.event}</td>
                                            <td>${ex.season}</td>
                                            ${type === 'jump' ? `<td>${ex.has_x}</td>` : ''}
                                            <td>${ex.bv.toFixed(2)}</td>
                                            <td style="color:${goeColor};">${goeStr}</td>
                                            <td class="score-val">${ex.score.toFixed(2)}</td>
                                        </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </details>
                `).join('');
            };

            // 5. 拼接组装页面 DOM
            const container = document.getElementById('analysis-content');
            container.innerHTML = `
                <h2 id="jumps" class="category-title" style="margin-top: 0;">跳跃</h2>

                <h3 id="jumps-solo" class="subcategory-title">单跳</h3>
                ${renderTable(jumpsSolo, 'jump')}

                <h3 id="jumps-combo" class="subcategory-title">连跳</h3>
                ${renderTable(jumpsCombo, 'jump')}

                <h2 id="spins" class="category-title">旋转</h2>
                ${renderTable(spins, 'spin')}

                <h2 id="steps" class="category-title">步法</h2>
                ${renderTable(steps, 'step')}
            `;

            // 新增的搜索功能逻辑
            const searchInput = document.getElementById('action-search-input');
            const searchBtn = document.getElementById('action-search-btn');
            const searchMessage = document.getElementById('search-message');

            const performSearch = () => {
                // 获取输入值，去除首尾空格，并统一转为小写以支持大小写不敏感搜索
                const query = searchInput.value.trim().toLowerCase();
                const details = document.querySelectorAll('.element-details');
                const categoryTitles = document.querySelectorAll('.category-title, .subcategory-title');
                let hasResult = false;

                if (query === '') {
                    // 如果搜索框为空，恢复所有数据的默认显示状态
                    details.forEach(detail => {
                        detail.style.display = 'block';
                        detail.open = false; // 恢复为折叠状态
                    });
                    categoryTitles.forEach(title => title.style.display = 'block');
                    searchMessage.style.display = 'none';
                    return;
                }

                // 遍历每一个动作详情框进行筛选
                details.forEach(detail => {
                    // 获取没有符号的处理后名称
                    const actionName = detail.querySelector('.summary-name').textContent.trim().toLowerCase();

                    // 判断是否包含搜索词
                    if (actionName.includes(query)) {
                        detail.style.display = 'block'; // 显示匹配项
                        detail.open = false;
                        hasResult = true;
                    } else {
                        detail.style.display = 'none';  // 隐藏不匹配项
                    }
                });

                // 搜索状态下，隐藏大分类和子分类的标题（比如“跳跃”、“单跳”），让页面更干净地只展示搜索结果
                categoryTitles.forEach(title => title.style.display = 'none');

                // 控制“没有结果”提示的显示与隐藏
                searchMessage.style.display = hasResult ? 'none' : 'block';
            };

            // 绑定点击事件和回车键触发搜索
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });

        }).catch(err => {
            console.error(err);
            document.getElementById('analysis-content').innerHTML = '<div class="loading" style="color:#e74c3c;">数据加载失败，请检查网络或文件路径是否正确。</div>';
        });
    </script>
</body>
</html>

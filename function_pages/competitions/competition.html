<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>比赛</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; color: #333; line-height: 1.6; }
        .timeline-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .title { text-align: center; color: #2c3e50; margin-bottom: 40px; font-size: 2em; }

        /* 赛季节点样式 */
        .season-node { background: #fff; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        .season-title { padding: 15px 20px; background: #2c3e50; color: #fff; font-weight: bold; cursor: pointer; outline: none; }

        /* 青年组标题颜色（稍浅的蓝灰色） */
        .season-node.junior .season-title { background: #546e7a; }

        /* Novice组标题颜色（更浅的蓝灰色） */
        .season-node.novice .season-title { background: #90a4ae; }

        /* 比赛卡片样式 */
        .event-wrapper { padding: 10px 20px; }
        .event-card { border-left: 3px solid #3498db; margin: 10px 0; background: #fafafa; }
        .event-name { padding: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
        .total-score { background: #e1f5fe; color: #0288d1; padding: 2px 8px; border-radius: 4px; font-size: 0.9em; }

        /* 原有：总分的PB和SB的标签样式 */
        .best-tag { margin-right: 5px; padding-right: 5px; border-right: 1px solid rgba(2, 136, 209, 0.3); }
        .best-tag.pb { color: #e74c3c; }
        .best-tag.sb { color: #e67e22; }

        /* 修改：让文字完美居中，标签绝对定位悬挂在左侧 */
        .project-container {
            display: inline-flex; /* 宽度由文字内容决定，并配合外部 td 的居中属性 */
            align-items: center;
            position: relative;   /* 作为内部标签绝对定位的基准 */
        }
        .badge-container {
            position: absolute;   /* 脱离文档流，不占用文字的排版宽度 */
            right: 100%;          /* 紧贴文字容器的左边缘 */
            margin-right: 8px;    /* 控制标签与文字的间距 */
            display: flex;
        }
        .project-label {
            text-align: left;
            white-space: nowrap; /* 确保文字不会换行 */
        }

        /* 单项 (SP/FS) 左侧的 PB/SB 独立小框样式 */
        .segment-best {
            display: inline-block;
            font-size: 0.85em;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            line-height: 1;
        }
        .segment-best.pb {
            color: #e74c3c; /* 红色字体 */
            background-color: rgba(231, 76, 60, 0.15); /* 红色浅色背景 */
        }
        .segment-best.sb {
            color: #e67e22; /* 橙色字体 */
            background-color: rgba(230, 126, 34, 0.15); /* 橙色浅色背景 */
        }

        /* 表格样式 */
        .event-details { padding: 15px; border-top: 1px solid #eee; }
        .score-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .score-table th, .score-table td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        .score-table th { color: #7f8c8d; font-size: 0.85em; text-transform: uppercase; }
        .score-table a { transition: color 0.2s;}
        .score-table a:hover { color: #3498db;}

        /* 按钮样式 */
        a { color: #3498db; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .btn-ex { display: inline-block; background: #9b59b6; color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 0.8em; margin-top: 10px; margin-left: 80px; }
        .btn-ex:hover { background: #8e44ad; color: #fff; text-decoration: none; }
    </style>
</head>
<body>
<div class="timeline-container">
    <h2 class="title">比赛时间轴</h2>
    <div id="timeline-content">加载中...</div>
</div>

<script>
    fetch(`../../data/competitions.json?t=${new Date().getTime()}`)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('timeline-content');
            let html = '';

            data.forEach(season => {
                let groupClass = '';
                if (season.season.includes('青年组')) {
                    groupClass = 'junior';
                } else if (season.season.includes('Novice组')) {
                    groupClass = 'novice';
                }

                html += `
                <details class="season-node ${groupClass}">
                    <summary class="season-title">${season.season}</summary>
                    <div class="event-wrapper">
                        ${season.events.map(event => `
                            <details class="event-card">
                                <summary class="event-name">
                                    <span>${event.name}</span>
                                        <span class="total-score">
                                        ${(event.best && event.best.includes('PB')) ? '<span class="best-tag pb">个人最佳(PB)</span>' : ''}
                                        ${(event.best && event.best.includes('SB')) ? '<span class="best-tag sb">赛季最佳(SB)</span>' : ''}
                                        ${event.total_score}
                                    </span>
                                </summary>
                                <div class="event-details">
                                    <table class="score-table">
                                        <tr><th>项目</th><th>排名</th><th>分数</th><th>视频</th></tr>
                                        ${renderRow('短节目 (SP)', event.segments.SP)}
                                        ${renderRow('自由滑 (FS)', event.segments.FS)}
                                    </table>
                                    ${event.exhibition_video ? `
                                        <div class="exhibition">
                                            <a href="${event.exhibition_video}" class="btn-ex" target="_blank">表演滑 (Gala)</a>
                                        </div>
                                    ` : ''}
                                </div>
                            </details>
                        `).join('')}
                    </div>
                </details>`;
            });
            container.innerHTML = html;
        });

    function renderRow(label, segment) {
        // 检查该项目是否包含best数据，渲染左侧小框
        let bestBadge = '';
        if (segment.best) {
            if (segment.best.includes('PB')) {
                bestBadge = `<span class="segment-best pb">PB</span>`;
            } else if (segment.best.includes('SB')) {
                bestBadge = `<span class="segment-best sb">SB</span>`;
            }
        }

        // 恢复原有逻辑：有 protocol_id 才生成点击跳转链接，否则只显示纯文本分数
        const scoreDisplay = segment.protocol_id
            ? `<a href="protocol.html?id=${segment.protocol_id}" style="text-decoration: underline; color: inherit;" target="_blank">${segment.score}</a>`
            : segment.score;

        const videoDisplay = segment.video_url
            ? `<a href="${segment.video_url}" target="_blank">▶️</a>`
            : `<span style="color: #ccc;">暂无视频</span>`;

        return `
            <tr>
                <td>
                    <div class="project-container">
                        <div class="badge-container">${bestBadge}</div>
                        <span class="project-label">${label}</span>
                    </div>
                </td>
                <td>${segment.rank || '-'}</td>
                <td>${scoreDisplay}</td>
                <td>${videoDisplay}</td>
            </tr>`;
    }
</script>
</body>
</html>
